name: Deploy Services (CodeDeploy Blue/Green)

# Triggers after the docker workflow pushes new images to ECR.
# Can also be triggered manually to redeploy a specific image tag.
on:
  workflow_run:
    workflows: [Build and Push Docker Images]
    types: [completed]
    branches: [rollout]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag to deploy (e.g. abc1234-12345678901)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Blue/green deploy ${{ matrix.service }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            container_port: 8080
            deploy_method: codedeploy
          - service: dashboard
            container_port: 8081
            deploy_method: codedeploy
          - service: worker
            container_port: 8090
            deploy_method: ecs

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            RUN_ID="${{ github.event.workflow_run.id }}"
            echo "image_tag=${SHA::7}-${RUN_ID}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve ECR registry
        id: aws
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ vars.AWS_REGION }}"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"
          echo "account_id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
          echo "region=${REGION}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"

      - name: Render task definition with new image
        env:
          CLUSTER_NAME: url-shortener
          SERVICE_NAME: ${{ matrix.service }}
          IMAGE_URI: ${{ steps.aws.outputs.registry }}/url-shortener/${{ matrix.service }}:${{ steps.tag.outputs.image_tag }}
        run: |
          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEF" \
            --query taskDefinition \
            > /tmp/current-taskdef.json

          cat > /tmp/update_task_image.py <<'PY'
          import json
          import sys

          service_name = sys.argv[1]
          image_uri = sys.argv[2]

          with open("/tmp/current-taskdef.json", encoding="utf-8") as handle:
              taskdef = json.load(handle)

          allowed_keys = {
              "family",
              "taskRoleArn",
              "executionRoleArn",
              "networkMode",
              "containerDefinitions",
              "volumes",
              "placementConstraints",
              "requiresCompatibilities",
              "cpu",
              "memory",
              "pidMode",
              "ipcMode",
              "proxyConfiguration",
              "inferenceAccelerators",
              "ephemeralStorage",
              "runtimePlatform",
          }
          rendered = {key: taskdef[key] for key in allowed_keys if key in taskdef}

          for container in rendered["containerDefinitions"]:
              if container["name"] == service_name:
                  container["image"] = image_uri
                  break
          else:
              raise SystemExit(f"container {service_name!r} not found in task definition")

          with open("/tmp/new-taskdef.json", "w", encoding="utf-8") as handle:
              json.dump(rendered, handle)
          PY

          python3 /tmp/update_task_image.py "$SERVICE_NAME" "$IMAGE_URI"

      - name: Register task definition
        id: register
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/new-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_def_arn=${TASK_DEF_ARN}" >> "$GITHUB_OUTPUT"
          echo "Registered ${TASK_DEF_ARN}"

      - name: Render AppSpec
        if: ${{ matrix.deploy_method == 'codedeploy' }}
        env:
          SERVICE_NAME: ${{ matrix.service }}
          CONTAINER_PORT: ${{ matrix.container_port }}
          TASK_DEF_ARN: ${{ steps.register.outputs.task_def_arn }}
        run: |
          cat > /tmp/render_appspec.py <<'PY'
          import os
          import textwrap

          content = textwrap.dedent(f"""\
          version: 0.0
          Resources:
            - TargetService:
                Type: AWS::ECS::Service
                Properties:
                  TaskDefinition: "{os.environ["TASK_DEF_ARN"]}"
                  LoadBalancerInfo:
                    ContainerName: "{os.environ["SERVICE_NAME"]}"
                    ContainerPort: {os.environ["CONTAINER_PORT"]}
                  PlatformVersion: "LATEST"
          """)

          with open("/tmp/appspec.yaml", "w", encoding="utf-8") as handle:
              handle.write(content)
          PY

          python3 /tmp/render_appspec.py
          cat /tmp/appspec.yaml

      - name: Create CodeDeploy deployment
        if: ${{ matrix.deploy_method == 'codedeploy' }}
        id: deploy
        env:
          SERVICE_NAME: ${{ matrix.service }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          APPSPEC_CONTENT=$(cat /tmp/appspec.yaml)
          APPSPEC_JSON=$(python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))' <<< "$APPSPEC_CONTENT")

          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "url-shortener-${SERVICE_NAME}" \
            --deployment-group-name "url-shortener-${SERVICE_NAME}" \
            --description "Deploy ${SERVICE_NAME}:${IMAGE_TAG} from ${GITHUB_SHA}" \
            --revision "{\"revisionType\":\"AppSpecContent\",\"appSpecContent\":{\"content\":${APPSPEC_JSON}}}" \
            --query 'deploymentId' \
            --output text)

          echo "deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
          echo "Deployment started: ${DEPLOYMENT_ID}"

      - name: Wait for CodeDeploy success
        if: ${{ matrix.deploy_method == 'codedeploy' }}
        env:
          SERVICE_NAME: ${{ matrix.service }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"
          echo "${SERVICE_NAME} blue/green deployment succeeded."

      - name: Update ECS worker service
        if: ${{ matrix.deploy_method == 'ecs' }}
        env:
          CLUSTER_NAME: url-shortener
          SERVICE_NAME: ${{ matrix.service }}
          TASK_DEF_ARN: ${{ steps.register.outputs.task_def_arn }}
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --task-definition "$TASK_DEF_ARN"

          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME"

          echo "${SERVICE_NAME} ECS deployment succeeded."
