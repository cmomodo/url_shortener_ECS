name: Build and Push Docker Images

on:
  push:
    branches: [rollout]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, rollout]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-push:
    name: Build and push ${{ matrix.service }}
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            context: ./app
            dockerfile: ./app/Dockerfile
          - service: worker
            context: ./services/worker
            dockerfile: ./services/worker/Dockerfile
          - service: dashboard
            context: ./services/dashboard
            dockerfile: ./services/dashboard/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # QEMU + Buildx are required to cross-compile linux/arm64 images on the
      # x86_64 GitHub-hosted runner. ECS tasks run on ARM64 Fargate.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image metadata
        id: meta
        run: |
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          IMAGE_TAG="${SHA::7}-${{ github.run_id }}"
          REPO="${{ steps.login-ecr.outputs.registry }}/url-shortener/${{ matrix.service }}"
          echo "timestamp=${TIMESTAMP}"      >> $GITHUB_OUTPUT
          echo "sha=${SHA::7}"              >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}"     >> $GITHUB_OUTPUT
          echo "tags=${REPO}:${IMAGE_TAG}"  >> $GITHUB_OUTPUT
          echo "full_sha=${SHA}"            >> $GITHUB_OUTPUT

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.full_sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.timestamp }}
