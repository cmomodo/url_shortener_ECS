# Bootstrap pipeline: provisions the ECR repositories (url-shortener/api,
# url-shortener/dashboard, url-shortener/worker) that the main infra pipeline
# (ci.yml) reads as data sources. Run this BEFORE the CI pipeline — the main
# stack fails to plan if these repositories do not yet exist.
#
# Required GitHub secrets (Settings > Secrets and variables > Actions):
#
#   AWS_TERRAFORM_ROLE_ARN  - ARN of the IAM role GitHub Actions assumes via
#                             OIDC to run Terraform.
#
# Required GitHub environment variables:
#   AWS_REGION        - AWS region where the ECR repositories are created
#   TF_STATE_BUCKET   - S3 bucket name for Terraform remote state
#                       (reuses the same bucket as the main pipeline, with a
#                        dedicated state key below)
#   TF_BOOTSTRAP_STATE_KEY - Dedicated bootstrap state key
#                            (expected: url-shortener-ecr/terraform.tfstate)

name: Bootstrap (ECR)

on:
  push:
    branches: [modules]
    paths:
      - "infra/ecr-chicken/**"
      - "modules/ecr/**"
      - ".github/workflows/bootstrap.yml"
  pull_request:
    branches: [modules]
    paths:
      - "infra/ecr-chicken/**"
      - "modules/ecr/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:
    inputs:
      terraform_action:
        description: Terraform command to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.terraform_action || 'plan' }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_BOOTSTRAP_STATE_KEY }}
  TF_IN_AUTOMATION: ${{ vars.TF_IN_AUTOMATION }}

jobs:
  bootstrap:
    name: Bootstrap ECR ${{ github.event.inputs.terraform_action || 'plan' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ecr-chicken
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.7"

      - name: Validate GitHub Actions configuration
        env:
          AWS_TERRAFORM_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
        run: |
          test -n "$AWS_REGION" || { echo "AWS_REGION repository variable is required"; exit 1; }
          test -n "$TF_STATE_BUCKET" || { echo "TF_STATE_BUCKET repository variable is required"; exit 1; }
          test -n "$TF_STATE_KEY" || { echo "TF_BOOTSTRAP_STATE_KEY repository variable is required"; exit 1; }
          test -n "$TF_IN_AUTOMATION" || { echo "TF_IN_AUTOMATION repository variable is required"; exit 1; }
          test -n "$AWS_TERRAFORM_ROLE_ARN" || { echo "AWS_TERRAFORM_ROLE_ARN secret is required"; exit 1; }

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init with remote state
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Save Terraform plan text
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload Terraform plan artifact (plan-only)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'plan')
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-terraform-plan-${{ github.run_id }}
          path: |
            infra/ecr-chicken/tfplan
            infra/ecr-chicken/tfplan.txt
          retention-days: 14

      - name: Upload Terraform plan artifact (before apply)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-terraform-apply-plan-${{ github.run_id }}
          path: |
            infra/ecr-chicken/tfplan
            infra/ecr-chicken/tfplan.txt
          retention-days: 14

      - name: Terraform apply
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
        run: terraform apply -auto-approve -input=false tfplan

      - name: Verify idempotency
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
        run: terraform plan -detailed-exitcode -input=false -lock-timeout=5m
