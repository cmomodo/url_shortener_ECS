# Required GitHub secrets (Settings > Secrets and variables > Actions):
#
#   AWS_TERRAFORM_ROLE_ARN  - ARN of the IAM role GitHub Actions assumes via
#                             OIDC to run Terraform (e.g. arn:aws:iam::<account-id>:role/<role-name>).
#                             Create this role using the script at infra/bootstrap/create_github_oidc_role.sh
#                             or by running `terraform apply` in the infra directory.
#
# Required GitHub environment variables (Settings > Secrets and variables > Actions > Variables):
#
#   These are already set in the env block below. Update them to match your environment:
#     AWS_REGION        - AWS region where resources are deployed
#     TF_STATE_BUCKET   - S3 bucket name for Terraform remote state
#     TF_STATE_KEY      - Path/key for the Terraform state file within the bucket
#     TF_LOCK_TABLE     - DynamoDB table name used for Terraform state locking

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      terraform_action:
        description: Terraform command to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.terraform_action || 'plan' }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: my-27-state-bucket
  TF_STATE_KEY: url-shortener-main/terraform.tfstate
  TF_LOCK_TABLE: terraform-state-locks
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.terraform_action || 'plan' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init with remote state
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event.inputs.terraform_action != 'apply'
        run: terraform plan -input=false -lock-timeout=5m

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply'
        run: terraform apply -auto-approve -input=false -lock-timeout=5m

      - name: Verify idempotency
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply'
        run: terraform plan -detailed-exitcode -input=false -lock-timeout=5m
