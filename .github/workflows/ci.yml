# Required GitHub secrets (Settings > Secrets and variables > Actions):
#
#   AWS_TERRAFORM_ROLE_ARN  - ARN of the IAM role GitHub Actions assumes via
#                             OIDC to run Terraform (e.g. arn:aws:iam::<account-id>:role/<role-name>).
#                             Create this role using the script at infra/bootstrap/create_github_oidc_role.sh
#                             or by running `terraform apply` in the infra directory.
#
# Required GitHub environment variables (Settings > Secrets and variables > Actions > Variables):
#
#   AWS_REGION        - AWS region where resources are deployed
#   TF_STATE_BUCKET   - S3 bucket name for Terraform remote state
#   TF_STATE_KEY      - Path/key for the main infra state file
#                       (expected: url-shortener-infra/terraform.tfstate)

name: CI

on:
  push:
    branches: [modules]
  pull_request:
    branches: [modules]
  workflow_dispatch:
    inputs:
      terraform_action:
        description: Terraform command to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'apply' || github.event.inputs.terraform_action || 'plan' }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
  TF_IN_AUTOMATION: ${{ vars.TF_IN_AUTOMATION }}
  TF_VAR_terraform_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}

jobs:
  terraform:
    name: Terraform ${{ github.event_name == 'push' && 'apply' || github.event.inputs.terraform_action || 'plan' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.7"

      - name: Validate GitHub Actions configuration
        env:
          AWS_TERRAFORM_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
        run: |
          test -n "$AWS_REGION" || { echo "AWS_REGION repository variable is required"; exit 1; }
          test -n "$TF_STATE_BUCKET" || { echo "TF_STATE_BUCKET repository variable is required"; exit 1; }
          test -n "$TF_STATE_KEY" || { echo "TF_STATE_KEY repository variable is required"; exit 1; }
          test -n "$TF_IN_AUTOMATION" || { echo "TF_IN_AUTOMATION repository variable is required"; exit 1; }
          test -n "$AWS_TERRAFORM_ROLE_ARN" || { echo "AWS_TERRAFORM_ROLE_ARN secret is required"; exit 1; }

      - name: Restrict Terraform applies to modules
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
        run: |
          if [ "$GITHUB_REF_NAME" != "modules" ]; then
            echo "::error::Terraform apply is restricted to the modules branch. Run a plan on this branch, or merge it into modules before applying."
            exit 1
          fi

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init with remote state
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name != 'push' && github.event.inputs.terraform_action != 'apply'
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Save Terraform plan text
        if: github.event_name != 'push' && github.event.inputs.terraform_action != 'apply'
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload Terraform plan artifact
        if: github.event_name != 'push' && github.event.inputs.terraform_action != 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: |
            infra/tfplan
            infra/tfplan.txt
          retention-days: 14

      - name: Terraform plan for apply
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Save Terraform apply plan text
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Guard protected ALB log bucket
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
        run: |
          terraform show -json tfplan > tfplan.json
          protected_deletions="$(
            jq -r '
              .resource_changes[]?
              | select(.type == "aws_s3_bucket" and .name == "alb_logs")
              | select(.change.actions | index("delete"))
              | .address
            ' tfplan.json
          )"

          if [ -n "$protected_deletions" ]; then
            echo "::error::Refusing to apply a plan that deletes the protected ALB log bucket:"
            echo "$protected_deletions"
            exit 1
          fi

      - name: Upload Terraform apply plan artifact
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-plan-${{ github.run_id }}
          path: |
            infra/tfplan
            infra/tfplan.txt
          retention-days: 14

      - name: Terraform apply
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
        run: terraform apply -auto-approve -input=false tfplan

      - name: Verify idempotency
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
        run: terraform plan -detailed-exitcode -input=false -lock-timeout=5m
