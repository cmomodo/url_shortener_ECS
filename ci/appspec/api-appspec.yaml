version: 0.0
Resources:
  - TargetService:
      Type: AWS::ECS::Service
      Properties:
        # Replace <TASK_DEFINITION> with the ARN returned by
        # `aws ecs register-task-definition` before triggering the deployment,
        # or use `aws ecs deploy --task-definition` which handles this automatically.
        TaskDefinition: "<TASK_DEFINITION>"
        LoadBalancerInfo:
          ContainerName: "api"
          ContainerPort: 8080
        PlatformVersion: "LATEST"
