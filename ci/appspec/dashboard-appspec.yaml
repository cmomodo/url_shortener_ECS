version: 0.0
Resources:
  - TargetService:
      Type: AWS::ECS::Service
      Properties:
        # Placeholder is replaced by CodeDeploy with the ARN of the task
        # definition it registers from taskdef-dashboard.json.
        TaskDefinition: "<TASK_DEFINITION>"
        LoadBalancerInfo:
          ContainerName: "dashboard"
          ContainerPort: 8081
        PlatformVersion: "LATEST"
